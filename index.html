<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Tiny Library</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="library.js"></script>
</head>
<body>
    <h1>Welcome to the library!</h1>
    <h2>Select a book:</h2>
    <div class="bookshelf">
        <div id="book-one" class="book blank">
            <div class="title">The Great Gatsby</div>
            <div class="author">Sample</div>
        </div>
        <div id="book-two" class="book blank">
            <div class="title">Pride and Prejudice</div>
            <div class="author">Sample</div>
        </div>
        <div id="book-three" class="book blank">
            <div class="title">Sense and Sensibility</div>
            <div class="author">Sample</div>
        </div>
        <div id="book-four" class="book blank">
            <div class="title">Becoming</div>
            <div class="author">Sample</div>
        </div>
        <div id="book-five" class="book blank">
            <div class="title">Antidisestablishmentarianism for the Abolute Beginner</div>
            <div class="author">Sample</div>
        </div>
    </div>
    <button type="button" id="add-book">Add Book</button>
    
    <form id="add-form">

        <div class="title">

        </div>
        <div class="author">

        </div>
-->
