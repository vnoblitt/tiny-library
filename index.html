<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Library</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="library.js"></script>
</head>
<body>
    <h1>Welcome to the library!</h1>
    
    <div class="supercontainer">
        
        <button command="show-modal" commandfor="form-dialogue" id="show-modal">+</button>

        <dialog id="form-dialogue">
            <form id="add-form">
                <label for="form-title">Title</label>
                <input id="form-title" name="form-title" type="text"/>
                
                <label for="form-author">Author</label>
                <input id="form-author" name="form-author" type="text"/>

                <label for="form-pages">Pages</label>
                <input id="form-pages" name="form-pages" type="number"/>

                <label for="form-read">Read?</label>
                <input id="form-read" name="form-read" type="checkbox"/>
            </form>
            <button type="button" id="add-book">Add Book</button>
            <button commandfor="form-dialogue" command="close">Close</button>
        </dialog>

        <div id="book-info">
           <p>Click the plus button to add books to the library.</p>
           <p>Click on a book's cover to view information about it.</p>
        </div>
    </div>
        
    </div>
    <h2>Select a book:</h2>
    <div id="bookshelf">
    </div>
   
    <button type="button" id="overwrite">test</button>  

</body>
</html>
